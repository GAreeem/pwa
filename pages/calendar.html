<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Indica a Safari que la aplicación puede ejecutarse en modo fullscreen/standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
 <!-- Define el estilo de la barra de estado (hora, batería) en iOS -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Icono principal de alta resolución para la pantalla de inicio de iOS -->
<link rel="apple-touch-icon" href="/images/icons/apple-icon-180x180.png" sizes="180x180">
<!-- Opcional: Icono sin el efecto de brillo que Safari aplica por defecto (si quieres control total) -->
<link rel="apple-touch-icon-precomposed" href="/images/icons/180.png">
  <title>Calendario</title>

  <link rel="manifest" href="mainmanifest.json">

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/main.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
  <script src="/register.js"></script>
</head>
<body class="bg-dark text-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Home</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li><a href="/index.html" class="nav-link">Inicio</a></li>
          <li><a href="/pages/calendar.html" class="nav-link active">Calendario</a></li>
          <li><a href="/pages/form.html" class="nav-link">Formulario</a></li>
          <li><a href="/pages/about.html" class="nav-link">Sobre mí</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4 text-center">
    <h1>📅 Calendario</h1>
    <div id="calendar" class="bg-light text-dark p-3 rounded shadow" style="max-width:900px;margin:auto;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'es',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: [
          { title: 'Clase de PWA', start: '2025-10-10' },
          { title: 'Entrega de proyecto', start: '2025-10-13' },
          { title: 'Revisión de código', start: '2025-10-15', end: '2025-10-16' }
        ]
      });
      calendar.render();
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
 <head>
  <meta charset="utf-8">
  <!-- Indica a Safari que la aplicación puede ejecutarse en modo fullscreen/standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
 <!-- Define el estilo de la barra de estado (hora, batería) en iOS -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Icono principal de alta resolución para la pantalla de inicio de iOS -->
<link rel="apple-touch-icon" href="/images/icons/apple-icon-180x180.png" sizes="180x180">
<!-- Opcional: Icono sin el efecto de brillo que Safari aplica por defecto (si quieres control total) -->
<link rel="apple-touch-icon-precomposed" href="/images/icons/180.png">
  <title>Formulario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/pwa/mainmanifest.json">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/register.js"></script>
</head>
<body class="bg-dark text-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Home</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="/index.html" class="nav-link">Inicio</a></li>
          <li class="nav-item"><a href="/pages/calendar.html" class="nav-link">Calendario</a></li>
          <li class="nav-item"><a href="/pages/form.html" class="nav-link active">Formulario</a></li>
          <li class="nav-item"><a href="/pages/about.html" class="nav-link">Sobre mí</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    <section class="card p-4 mx-auto" style="max-width: 520px;">
      <h2>📬 Envíanos un mensaje</h2>

      <form id="contactForm" class="formulario" novalidate>
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required placeholder="Tu nombre..." class="form-control mb-3">

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com" class="form-control mb-3">

        <label for="age">Edad:</label>
        <input type="number" id="age" name="age" required placeholder="Tu edad..." class="form-control mb-3">

        <!-- IMPORTANTE: este ID lo usa app.js -->
        <button type="button" id="savebtn" class="btn btn-primary w-100 mb-2">Enviar</button>
        <button type="button" id="listbtn" class="btn btn-secondary w-100">📋 Listar</button>
      </form>

      <p id="mensaje-resultado" class="resultado mt-3 text-center"></p>
    </section>

    <div class="container mt-4" id="userListContainer">
      <h4 class="text-center mb-3">Lista de usuarios</h4>
      <div id="userList" class="row justify-content-center"></div>
    </div>
  </main>

  <!-- Orden correcto: primero PouchDB, luego tu app -->
  <script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
  <script src="/app.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
